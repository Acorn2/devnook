name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS checks, tests and native build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Isolate application data
        run: echo "DEVNOOK_DATA_DIR=$RUNNER_TEMP/devnook-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6; packageManager pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend type, format and presentation tests
        run: |
          pnpm check
          pnpm format:check
          pnpm test:ui
      - name: Build and validate product website
        run: |
          pnpm site:build
          pnpm site:check
      - name: Rust format, type and integration tests
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Build CLI and native desktop
        run: |
          cargo build -p devnook-cli --locked
          pnpm tauri build --debug --no-bundle
