[workspace]
members = ["crates/devnook-core", "apps/desktop/src-tauri", "apps/cli"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
