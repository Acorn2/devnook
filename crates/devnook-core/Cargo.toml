[package]
name = "devnook-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
url = "2"
sha2 = "0.10"
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
quick-xml = "0.42"
glob = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
